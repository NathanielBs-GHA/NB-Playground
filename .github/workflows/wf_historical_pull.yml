name: Sync eBird Waterfowl Data

on:
  # Allows you to click a button in GitHub to run it instantly
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests psycopg2-binary python-dotenv

    - name: Run ingestion script
      # Securely map your GitHub repository secrets to environment variables
      env:
        EBIRD_API_KEY: ${{ secrets::EBIRD_API_KEY }}
        NEON_CONNECTION_STRING: ${{ secrets::NEON_CONNECTION_STRING }}
      run: python import_ebird_history.py
